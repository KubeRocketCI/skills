name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Test the validator
        run: python -m unittest discover -s scripts

      - name: Check the skill contract
        run: python scripts/validate.py

  manifests-and-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Uses the runner's Node.js. Claude Code needs Node.js >= 22.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.49.1 '**/*.md'

      - name: Validate plugin manifests
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude() { npx --yes @anthropic-ai/claude-code@2.1.280 "$@"; }
          claude plugin validate . --strict
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict
          done

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a version bump for every changed plugin
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Returns 0 if $1 > $2 in semver ordering, using GNU sort -V
          semver_gt() {
            local highest
            highest=$(printf '%s\n%s' "$1" "$2" | sort -V | tail -1)
            [[ "$highest" == "$1" && "$1" != "$2" ]]
          }

          FAILED=0
          # Changes under plugins/<plugin>/evals/ need no version bump.
          PLUGINS=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -v '^plugins/[^/]*/evals/' \
            | sed -n 's|^plugins/\([^/]*\)/.*|\1|p' | sort -u || true)

          for PLUGIN in $PLUGINS; do
            MANIFEST="plugins/$PLUGIN/.claude-plugin/plugin.json"
            if [[ ! -f "$MANIFEST" ]]; then
              echo "::warning::No manifest at $MANIFEST, skipping"
              continue
            fi

            NEW_VERSION=$(jq -r '.version' "$MANIFEST")
            OLD_VERSION=$(git show "origin/${BASE_REF}:$MANIFEST" 2>/dev/null | jq -r '.version') || OLD_VERSION=""

            if [[ -z "$OLD_VERSION" ]]; then
              echo "$PLUGIN: new plugin at $NEW_VERSION"
            elif semver_gt "$NEW_VERSION" "$OLD_VERSION"; then
              echo "$PLUGIN: $OLD_VERSION -> $NEW_VERSION"
            else
              echo "::error::Plugin '$PLUGIN' changed but its version did not increase (base $OLD_VERSION, head $NEW_VERSION). Bump it in all three manifests and its bundles."
              FAILED=1
            fi
          done

          exit "$FAILED"
